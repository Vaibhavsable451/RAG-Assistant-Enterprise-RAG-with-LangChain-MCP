name: CI/CD - Build, Test, Deploy to Azure App Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'neuraguard' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Lint (basic syntax check)
        run: python -m py_compile $(git ls-files '*.py')

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (Service Principal)
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy via Publish Profile
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Deploy via Azure Credentials
        if: ${{ secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Setup Notice (Missing Azure Credentials/Publish Profile)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS == '' }}
        run: |
          echo "::notice title=Azure Deployment Setup Required::Neither AZURE_WEBAPP_PUBLISH_PROFILE nor AZURE_CREDENTIALS secret found."
          echo "=========================================================================="
          echo "To enable automatic deployment to Azure App Service:"
          echo "1. Go to Azure Portal -> your App Service -> Overview -> 'Get publish profile'."
          echo "2. Go to your GitHub repository -> Settings -> Secrets and variables -> Actions."
          echo "3. Click 'New repository secret':"
          echo "   - Name: AZURE_WEBAPP_PUBLISH_PROFILE"
          echo "   - Value: Paste the XML content of your downloaded publish profile."
          echo "4. Under 'Variables' tab, click 'New repository variable':"
          echo "   - Name: AZURE_WEBAPP_NAME"
          echo "   - Value: Your Azure App Service app name (e.g. my-rag-app)."
          echo "=========================================================================="

