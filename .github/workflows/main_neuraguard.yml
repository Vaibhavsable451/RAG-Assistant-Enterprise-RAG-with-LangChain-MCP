name: Build, Governance Gate & Deploy — neuraguard AI Governance Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── Job 1: Core unit tests + AI Governance test gate ───────────────────────
  build-and-test:
    name: 🧪 Test & Governance Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run core RAG tests
        run: |
          pytest tests/test_governance_and_chunking.py -v --tb=short

      - name: 🛡️ Run AI Governance test gate
        run: |
          pytest tests/test_ai_governance.py -v --tb=short

      - name: 📊 Generate combined test report
        if: always()
        run: |
          pytest tests/ -v --tb=short --junit-xml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

      - name: Upload application artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.venv/
            !__pycache__/
            !.git/
            !data/
            !*.pyc

  # ─── Job 2: Deploy to Azure (only on main, after governance gate passes) ────
  deploy:
    name: 🚀 Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D691E86846B64D2B951021DEFE91A9A4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A08DD489599646D89324C377A2CBAD5D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E18A5D5D843C4D3F9B07384347E42783 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'neuraguard'
          slot-name: 'Production'
          package: '.'